<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bosch Tightening Analyzer</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #070707;
      --panel: #111111;
      --panel-2: #161616;
      --border: #2a2a2a;
      --text: #f5f5f5;
      --muted: #aaaaaa;
      --gold: #e6c77a;
      --green: #39d98a;
      --red: #ff5d73;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, rgba(230,199,122,0.08), transparent 20%), var(--bg);
      color: var(--text);
      padding: 20px;
    }

    .wrap {
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 12px 0 24px;
      font-size: 36px;
      color: white;
    }

    .panel {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 12px;
    }

    .col-3 { grid-column: span 3; }
    .col-4 { grid-column: span 4; }
    .col-6 { grid-column: span 6; }
    .col-12 { grid-column: span 12; }

    @media (max-width: 1000px) {
      .col-3, .col-4, .col-6, .col-12 { grid-column: span 12; }
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input, select, button {
      width: 100%;
      min-height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0c0c0c;
      color: white;
      padding: 10px 12px;
      font-size: 14px;
    }

    button {
      cursor: pointer;
      background: #171717;
      font-weight: 700;
    }

    button:hover {
      border-color: #6b5a2d;
      color: var(--gold);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    @media (max-width: 1000px) {
      .stats { grid-template-columns: 1fr 1fr; }
    }

    .stat {
      background: #0c0c0c;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
    }

    .stat .value {
      font-size: 30px;
      font-weight: 800;
      color: var(--gold);
    }

    .stat .label {
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: 16
